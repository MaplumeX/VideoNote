services:
  backend:
    image: maplumex/videonote-backend:latest
    env_file: .env
    environment:
      - UPLOAD_DIR=/data/videonote
    volumes:
      - videonote-data:/data/videonote
    expose:
      - "8000"

  frontend:
    image: maplumex/videonote-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  videonote-data:
